<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Finora</title><link rel="stylesheet" href="/static/style.css"><style>
.login-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#edf2ff,#f8fafc)}.login-card{width:min(420px,100%);background:white;border:1px solid #e4e9f2;border-radius:20px;padding:34px;box-shadow:0 18px 60px #20365b18}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.login-brand .brand-mark{width:45px;height:45px;display:grid;place-items:center;border-radius:13px;background:#315bc7;color:white;font-weight:900;font-size:22px}.login-card h1{font-size:25px;margin:0 0 7px}.login-card p{color:#7d899d;font-size:13px;line-height:1.6;margin-bottom:24px}.login-card label{display:grid;gap:8px;font-size:12px;font-weight:700;color:#58667b;margin-bottom:16px}.login-card input{width:100%;box-sizing:border-box}.login-card button{width:100%;padding:13px}.login-error{background:#fff0f0;color:#b64444;border-radius:8px;padding:10px;font-size:12px;margin-bottom:15px}.login-note{font-size:11px!important;margin:18px 0 0!important}
</style></head><body class="login-page"><main class="login-card"><div class="login-brand"><span class="brand-mark">F</span><div><strong>Finora</strong><div class="eyebrow">FINANCE WORKSPACE</div></div></div><h1>Welcome back</h1><p>Sign in to manage your company income, expenses, employees and financial reports.</p>{% if error %}<div class="login-error">{{ error }}</div>{% endif %}<form method="post" action="/login"><label>Username<input name="username" autocomplete="username" required autofocus maxlength="80"></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary-btn" type="submit">Sign in securely</button></form><p class="login-note">Educational project demo. Use the administrator credentials configured for this installation.</p></main></body></html>
